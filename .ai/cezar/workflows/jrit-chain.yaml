# jrit-chain: committed brief -> plan -> drive compile and start, as one cezar task; the generated drive run
# (jrit-drive.I<n>.<id8>) then runs the units and the landing: review -> local CI -> merge card -> squash push -> CI watch -> branch cleanup.
# Cezar 0.15.0 graph format (version 2). The kit stamp script copies this file to
# .ai/cezar/workflows/jrit-chain.yaml and the kit scripts to .ai/jrit/; edit the
# template in jrit-core, never the stamped copy.
#
# Start: task text "<brief path> [--from plan|drive|review] [--to plan] [--branch <old branch>]", autonomous off,
# model opus; restart a stopped run with scripts/chain-restart.sh in jrit-core.
# "--to plan" ends the run at "planned" once the plan gate passes.
# Drive: drive-compile lints the committed plan and compiles it into the drive workflow
# .ai/cezar/workflows/jrit-drive.I<n>.<id8>.yaml at the project root; drive-start starts that workflow as
# its own run (--from unit=1 --branch <this branch>), and this run ends at handed-off naming the run id.
# A failed compile or start ends this run failed naming the node; the compile's lint output is the reason.
# Questions: the plan stage ends its reply with a JRIT-ASK line carrying a JSON questions object (the form
# .ai/jrit/cards.md gives); plan-asked prints that card JSON alone, and the ask-user node renders
# it as cezar's structured card with no deadline. The plan stage asks one card; a second question
# parks at plan-exhausted, whose approve has the stage take marked defaults. Cut-offs: cezar stops any
# non-final agent step after 30 minutes; <stage>-cut-check lets only that timeout continue the same
# session through <stage>-resume, and any other agent failure ends at stopped-agent-error.
# Pings: a ping-<node> check runs ping.sh before every human gate, every card, and every end.
# Landing: the nodes and edges inside the landing marker comments below (drive gate through the
# end nodes) are self-contained (no YAML alias, every edge target inside); the drive compile copies
# them verbatim, so keep them that way.
# Every failure port left unwired ends the run failed, naming the node or loop in run.error.
version: 2
name: jrit-chain
description: Committed brief to a committed plan through the jrit-loop plan skill and its one question card, then a compiled drive run that lands one squash commit on main through review and a merge card.
nodes:
  - { id: start, name: "Start", type: start }
  - { id: preflight, name: "Preflight", type: check, command: "bash .ai/jrit/stage-preflight.sh" }
  - { id: route-review, name: "Route: review?", type: if, condition: { kind: output, ref: preflight.output, op: contains, value: "Route: review" } }
  - { id: route-drive, name: "Route: drive?", type: if, condition: { kind: output, ref: preflight.output, op: contains, value: "Route: drive" } }

  - id: plan
    name: "Plan stage"
    type: agent
    model: &chain-model opus
    allowedTools: &stage-tools [Read, Edit, Write, Grep, Glob, Bash, Skill, Agent, ToolSearch, TaskCreate, TaskUpdate, TaskList, TaskGet]
    prompt: |
      Preflight for this chain reported:
      {{nodes.preflight.output}}
      Use the jrit-loop loop-plan skill on the brief named on the Brief: line above.
      Run its optional Rubix review without offering it first.
      Every question you would ask the human, the commit offer included, follows the dispatched-session protocol in the card form .ai/jrit/cards.md gives; read that file before your first question.
      Narrate in one-line status updates.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING: JRIT-ASK is this chain's only question channel, and the graph decides when the task is done.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
      Commit the approved plan, and end with its repo-relative path on the last line.
  - { id: plan-asked, name: "Plan: read the card", type: check, command: "bash .ai/jrit/stage-asked.sh" }
  - { id: plan-has-question, name: "Plan: no question?", type: if, condition: { kind: output, ref: plan-asked.output, op: contains, value: "No question from" } }
  # Counts question turns only (it sits on plan-has-question.false), and bounds the cycle
  # plan-take-defaults -> plan-asked -> plan-ask-rounds.exhausted -> plan-exhausted, which cezar
  # refuses unless it passes a loop's repeat port. 3 is the one card, the exhausted gate, and one
  # re-offer of that gate; a fourth question turn reaches the unwired exhausted port and fails the
  # run naming this loop. Replies with no question (resumes, fixes) do not count against it.
  - { id: plan-read-rounds, name: "Plan: question turns", type: loop, max: 3 }
  - { id: plan-ask-rounds, name: "Plan: question rounds", type: loop, max: 1 }
  - { id: plan-ping, name: "Ping: plan card", type: check, command: "bash .ai/jrit/ping.sh card plan-asked" }
  - { id: plan-ask, type: ask-user, name: "Plan question", question: "{{nodes.plan-asked.output}}" }
  - id: plan-answer
    name: "Plan: human answered"
    type: agent
    model: *chain-model
    allowedTools: *stage-tools
    session: { continue: plan }
    prompt: |
      The human answered your card, one <header>: <label> line per question, or in free text:
      {{nodes.plan-ask.answer}}
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING; JRIT-ASK stays the only question channel.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
  - { id: ping-plan-exhausted, name: "Ping: plan still asking", type: check, command: "bash .ai/jrit/ping.sh card plan-asked" }
  - { id: plan-exhausted, type: gate.human, name: "Plan: card budget spent", message: "{{nodes.plan-asked.output}}\nThe plan stage has asked its one card and still has the question above. Approve continues the stage with every remaining choice taken as a default marked NEEDS HUMAN CONFIRMATION; reject ends this run." }
  - id: plan-take-defaults
    name: "Plan: take the defaults"
    type: agent
    model: *chain-model
    allowedTools: *stage-tools
    session: { continue: plan }
    prompt: |
      The human will answer no more cards: take the documented default for every open choice, write each as NEEDS HUMAN CONFIRMATION in the plan's decision log, commit the plan, and end with its path on the last line.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING; JRIT-ASK stays the only question channel.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
  - { id: ping-plan-rejected, name: "Ping: plan rejected", type: check, command: "bash .ai/jrit/ping.sh end plan-rejected" }
  - { id: plan-rejected, name: "Plan rejected", type: end, status: failed }
  - { id: plan-cut-check, name: "Plan: cut-off check", type: check, command: "bash .ai/jrit/stage-cut-reason.sh" }
  - { id: plan-cut-rounds, name: "Plan: cut-off rounds", type: loop, max: 3 }
  - id: plan-resume
    name: "Plan: resume after cut-off"
    type: agent
    model: *chain-model
    allowedTools: *stage-tools
    session: { continue: plan }
    prompt: &resume-prompt |
      Your previous turn was stopped by cezar's 30-minute limit on one agent step, possibly in the middle of a tool call.
      Continue this stage from where you stopped: check git status and git log first, keep the work already done, and do not restart the stage.
      The rules of this stage still hold, including the card rules in .ai/jrit/cards.md.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING; JRIT-ASK stays the only question channel.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
  - { id: plan-gate, name: "Plan gate", type: check, command: "bash .ai/jrit/stage-gate.sh plan" }
  - { id: plan-fix-rounds, name: "Plan: fix rounds", type: loop, max: 2 }
  - id: plan-fix
    name: "Plan: fix the gate"
    type: agent
    model: *chain-model
    allowedTools: *stage-tools
    session: { continue: plan }
    prompt: |
      The plan gate failed; its output is appended below.
      Fix the plan so the gate passes, commit it, and end with its path on the last line.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING; JRIT-ASK stays the only question channel.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
  - { id: route-to-plan, name: "Route: stop after the plan?", type: if, condition: { kind: output, ref: preflight.output, op: contains, value: "To: plan" } }
  - { id: ping-planned, name: "Ping: planned", type: check, command: "bash .ai/jrit/ping.sh end planned" }
  - { id: planned, name: "Planned", type: end, status: success }

  - { id: drive-compile, name: "Drive: compile the plan", type: check, command: "bash .ai/jrit/stage-drive.sh compile" }
  - { id: drive-start, name: "Drive: start the generated run", type: check, command: "bash .ai/jrit/stage-drive.sh start" }
  - { id: ping-handed-off, name: "Ping: handed off", type: check, command: "bash .ai/jrit/ping.sh end handed-off" }
  - { id: handed-off, name: "Handed off to the drive run", type: end, status: success }

  # landing:begin
  - { id: drive-gate, name: "Drive gate", type: check, command: "bash .ai/jrit/stage-gate.sh drive" }
  - { id: landing-fix-rounds, name: "Landing: fix rounds", type: loop, max: 2 }
  - id: landing-fix
    name: "Landing: fix the whole-branch gate"
    type: agent
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, Agent, ToolSearch, TaskCreate, TaskUpdate, TaskList, TaskGet]
    prompt: |
      The whole-branch gate failed; its output is appended below. Read the plan and the branch's commits, fix the failing work without editing any committed test or acceptance check, commit, and end your turn.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING, and never write JRIT-ASK: no card is read after this step.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.

  - id: review
    name: "Review stage"
    type: agent
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, Agent, ToolSearch, TaskCreate, TaskUpdate, TaskList, TaskGet]
    verdicts: [approve, changes]
    prompt: |
      Preflight for this chain reported:
      {{nodes.preflight.output}}
      Use the jrit-loop loop-review skill on this branch's diff since its merge base with the branch on the Base: line above.
      Do not ask the human anything in this stage: write any question as a finding.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING; end with the verdict line cezar asks for.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
      List every finding that must be fixed before merge.
      Choose changes when that list is not empty, otherwise approve.
  - { id: review-cut-check, name: "Review: cut-off check", type: check, command: "bash .ai/jrit/stage-cut-reason.sh" }
  - { id: review-cut-rounds, name: "Review: cut-off rounds", type: loop, max: 2 }
  - { id: review-rounds, name: "Review: fix rounds", type: loop, max: 2 }
  - id: review-fix
    name: "Review: apply fixes"
    type: agent
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, Agent, ToolSearch, TaskCreate, TaskUpdate, TaskList, TaskGet]
    prompt: |
      Read the plan and the branch's commits first.
      Review asked for these fixes before merge:
      {{nodes.review.summary}}
      Fix them on this branch, commit, and end your turn.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING, and never write JRIT-ASK: no card is read after this step.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.

  - { id: commit, name: "Commit the work", type: git.commit, message: "Finish the chain for {{task}}" }
  - { id: commit-ownership, name: "Ownership check", type: check, command: "bash .ai/jrit/stage-gate.sh ownership" }
  - { id: local-ci, name: "Local CI", type: check, command: "bash .ai/jrit/stage-end.sh local-ci" }
  - { id: ci-fix-rounds, name: "CI: fix rounds", type: loop, max: 2 }
  - id: ci-fix
    name: "CI: fix the failure"
    type: agent
    model: opus
    allowedTools: [Read, Edit, Write, Grep, Glob, Bash, Skill, Agent, ToolSearch, TaskCreate, TaskUpdate, TaskList, TaskGet]
    prompt: |
      Read the plan and the branch's commits first.
      This repo's local CI or the ownership check after the commit failed; its output is appended below.
      Fix the cause on this branch (remove a file the plan does not own rather than adding it to the plan), commit, and end your turn.
      Never emit CEZ:ASK, CEZ:DONE, or CEZ:MONITORING, and never write JRIT-ASK: no card is read after this step.
      No human watches this session: where the card rules leave a choice open, take the documented default, write it as NEEDS HUMAN CONFIRMATION in your handoff, and never raise a second card for it.
  - { id: merge-card-text, name: "Merge card text", type: check, command: "bash .ai/jrit/stage-end.sh merge-card" }
  - { id: ping-merge, name: "Ping: merge card", type: check, command: "bash .ai/jrit/ping.sh card merge-card-text" }
  - { id: merge, type: gate.human, name: "Merge to main", message: "{{nodes.merge-card-text.output}}" }
  - { id: merge-push, name: "Squash and push", type: check, command: "bash .ai/jrit/stage-end.sh merge-push" }
  - { id: ci-watch, name: "Watch GitHub CI", type: check, command: "bash .ai/jrit/stage-end.sh ci-watch" }
  - { id: ping-ci-red, name: "Ping: CI red card", type: check, command: "bash .ai/jrit/ping.sh card ci-watch" }
  - { id: ci-red, type: gate.human, name: "GitHub CI is red", message: "{{nodes.ci-watch.output}}\nIf the output above names failing jobs, the three commands above undo the push; if it says nothing is known to be broken, check the Actions tab and do not undo. Approve or reject: either one ends this run as failed with this card as its reason." }
  - { id: cleanup, name: "Clean up the generated workflow", type: check, command: "bash .ai/jrit/stage-drive.sh cleanup" }
  - { id: branch-cleanup, name: "Delete the landing run's branch", type: check, command: "bash .ai/jrit/stage-end.sh branch-cleanup" }
  - { id: ping-ok, name: "Ping: done", type: check, command: "bash .ai/jrit/ping.sh end ok branch-cleanup" }
  - { id: ok, name: "Done", type: end, status: success }
  - { id: ping-merge-rejected, name: "Ping: merge rejected", type: check, command: "bash .ai/jrit/ping.sh end merge-rejected" }
  - { id: merge-rejected, name: "Merge rejected", type: end, status: failed }
  - { id: ping-ci-red-after-push, name: "Ping: CI red after push", type: check, command: "bash .ai/jrit/ping.sh end ci-red-after-push" }
  - { id: ci-red-after-push, name: "CI red after push", type: end, status: failed }
  - { id: ping-stopped-agent-error, name: "Ping: stopped on an agent error", type: check, command: "bash .ai/jrit/ping.sh end stopped-agent-error" }
  - { id: stopped-agent-error, name: "Stopped: agent error", type: end, status: failed }
  # landing:end
edges:
  - { from: start, to: preflight }
  - { from: preflight.pass, to: route-review }
  - { from: route-review.true, to: drive-gate }
  - { from: route-review.false, to: route-drive }
  - { from: route-drive.true, to: drive-compile }
  - { from: route-drive.false, to: plan }

  - { from: plan.done, to: plan-asked }
  - { from: plan.failed, to: plan-cut-check }
  - { from: plan-cut-check.pass, to: plan-cut-rounds }
  - { from: plan-cut-check.fail, to: ping-stopped-agent-error }
  - { from: plan-cut-rounds.repeat, to: plan-resume }
  - { from: plan-resume.done, to: plan-asked }
  - { from: plan-resume.failed, to: plan-cut-check }
  - { from: plan-asked.pass, to: plan-has-question }
  - { from: plan-has-question.true, to: plan-gate }
  - { from: plan-has-question.false, to: plan-read-rounds }
  - { from: plan-read-rounds.repeat, to: plan-ask-rounds }
  - { from: plan-ask-rounds.repeat, to: plan-ping }
  - { from: plan-ping.pass, to: plan-ask }
  - { from: plan-ping.fail, to: plan-ask }
  - { from: plan-ask.answered, to: plan-answer }
  - { from: plan-answer.done, to: plan-asked }
  - { from: plan-answer.failed, to: plan-cut-check }
  - { from: plan-ask-rounds.exhausted, to: ping-plan-exhausted }
  - { from: ping-plan-exhausted.pass, to: plan-exhausted }
  - { from: ping-plan-exhausted.fail, to: plan-exhausted }
  - { from: plan-exhausted.approve, to: plan-take-defaults }
  - { from: plan-exhausted.reject, to: ping-plan-rejected }
  - { from: ping-plan-rejected.pass, to: plan-rejected }
  - { from: ping-plan-rejected.fail, to: plan-rejected }
  - { from: plan-take-defaults.done, to: plan-asked }
  - { from: plan-take-defaults.failed, to: plan-cut-check }
  - { from: plan-gate.pass, to: route-to-plan }
  - { from: plan-gate.fail, to: plan-fix-rounds }
  - { from: plan-fix-rounds.repeat, to: plan-fix }
  - { from: plan-fix.done, to: plan-asked }
  - { from: plan-fix.failed, to: plan-cut-check }
  - { from: route-to-plan.true, to: ping-planned }
  - { from: route-to-plan.false, to: drive-compile }
  - { from: ping-planned.pass, to: planned }
  - { from: ping-planned.fail, to: planned }

  - { from: drive-compile.pass, to: drive-start }
  - { from: drive-start.pass, to: ping-handed-off }
  - { from: ping-handed-off.pass, to: handed-off }
  - { from: ping-handed-off.fail, to: handed-off }

  # landing-edges:begin
  - { from: drive-gate.pass, to: review }
  - { from: drive-gate.fail, to: landing-fix-rounds }
  - { from: landing-fix-rounds.repeat, to: landing-fix }
  - { from: landing-fix.done, to: drive-gate }
  - { from: landing-fix.failed, to: ping-stopped-agent-error }

  - { from: review.approve, to: commit }
  - { from: review.changes, to: review-rounds }
  - { from: review.failed, to: review-cut-check }
  - { from: review-cut-check.pass, to: review-cut-rounds }
  - { from: review-cut-check.fail, to: ping-stopped-agent-error }
  - { from: review-cut-rounds.repeat, to: review }
  - { from: review-rounds.repeat, to: review-fix }
  - { from: review-fix.done, to: drive-gate }
  - { from: review-fix.failed, to: ping-stopped-agent-error }

  - { from: commit.done, to: commit-ownership }
  - { from: commit.nothing, to: commit-ownership }
  - { from: commit-ownership.pass, to: local-ci }
  - { from: commit-ownership.fail, to: ci-fix-rounds }
  - { from: local-ci.pass, to: merge-card-text }
  - { from: local-ci.fail, to: ci-fix-rounds }
  - { from: ci-fix-rounds.repeat, to: ci-fix }
  - { from: ci-fix.done, to: drive-gate }
  - { from: ci-fix.failed, to: ping-stopped-agent-error }
  - { from: merge-card-text.pass, to: ping-merge }
  - { from: ping-merge.pass, to: merge }
  - { from: ping-merge.fail, to: merge }
  - { from: merge.approve, to: merge-push }
  - { from: merge.reject, to: ping-merge-rejected }
  - { from: merge-push.pass, to: ci-watch }
  - { from: ci-watch.pass, to: cleanup }
  - { from: ci-watch.fail, to: ping-ci-red }
  - { from: ping-ci-red.pass, to: ci-red }
  - { from: ping-ci-red.fail, to: ci-red }
  - { from: ci-red.approve, to: ping-ci-red-after-push }
  - { from: ci-red.reject, to: ping-ci-red-after-push }
  - { from: cleanup.pass, to: branch-cleanup }
  - { from: cleanup.fail, to: branch-cleanup }
  - { from: branch-cleanup.pass, to: ping-ok }
  - { from: branch-cleanup.fail, to: ping-ok }
  - { from: ping-ok.pass, to: ok }
  - { from: ping-ok.fail, to: ok }
  - { from: ping-merge-rejected.pass, to: merge-rejected }
  - { from: ping-merge-rejected.fail, to: merge-rejected }
  - { from: ping-ci-red-after-push.pass, to: ci-red-after-push }
  - { from: ping-ci-red-after-push.fail, to: ci-red-after-push }
  - { from: ping-stopped-agent-error.pass, to: stopped-agent-error }
  - { from: ping-stopped-agent-error.fail, to: stopped-agent-error }
  # landing-edges:end
